<!DOCTYPE html>
<html>
	<head>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
		<title>
			{{block "page.title" . }} WiP | Work in Peace ⏰ {{end}}
		</title>
		<style>
		body {
			font-family: sans-serif;
		}
		ul.alarm {
			padding: 0;
			margin: 0;
			margin-bottom: 3px;
			display: flex;
			flex-wrap: wrap;
		}
		ul.alarm li {
			display: inline-block;
			flex-grow: 1;
			margin: 0px 3px;
			padding-right: 3px;
			border: solid #ddd 1px;
			border-radius: 3px;
		}
		.alarm span {
			background: #eee;
			padding: 0px 3px;
			border-top-left-radius: 3px;
			border-bottom-left-radius: 3px;
			font-style: italic;
			display: inline-block;
			height: 100%;
		}
		table.alarm {
			width: 100%;
			border-collapse: collapse;
		}
		table.alarm td {
			margin: 0px 0px;
			padding: 3px;
			padding-left: 0px;
			border: solid #ddd 1px;
			border-radius: 3px;
				position: relative;
		}
		.alarm {
			border-left: solid lightgreen 5px;
		}
		.alarm.overdue {
			border-left: solid darkred 5px;
			color: darkred;
			font-weight: bold;
		}
		table.alarm.cancelled tr {
			border-left: solid lightgrey 5px;
		}
		</style>
	</head>
	<body>
		<header>
			{{block "page.header" . }}{{end}}
		</header>
		<main>
			{{block "page.main" . }}{{end}}
		</main>
		<footer>
			{{block "page.footer" . }}{{end}}
		</footer>
	</body>
</html>
