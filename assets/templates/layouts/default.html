<!DOCTYPE html>
<html>
	<head>
		 <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
		<title>
			{{block "page.title" . }} WiP | Work in Peace ⏰ {{end}}
		</title>
		<style>
		@font-face {
			font-family: Excalifont;
			src: url(/fonts/Excalifont-Regular.woff2);
		}
		* {
			box-sizing: border-box;
		}
		body {
			padding: 0;
			margin:0;
			background: #eee;
			font-family: sans-serif;
		}
		header {
			background: white;
			padding: 0.5em 0.25em;
			box-shadow: 0px 0px 5px #888;
			display: flex;
			align-items: center;
			justify-content: space-between;

			.hero {
				display: flex;
				img {
					height: 2em;
					filter: grayscale(0.3);
				}

				h1 {
					margin: 0 0.5em;
					font-family: Excalifont;
					font-size: 1.75em;
					font-size: 2em;
					color: #777;
				}
			}

			nav {

				font-family: Excalifont;
				ul {
					padding: 0;
					margin: 0;
					li {
						display: inline-block;
						padding: 0 1em;
					}
				}
			}

			.userinfo {
				padding: 0 1em;
				display: inline-block;
				text-align: right;
				font-family: Excalifont;
			}
		}

		main {
			max-width: 1024px;
			margin: 0 auto;
		}

		h2 {
			margin: 0.5em;
			margin-top: 1.5em;
			border-bottom: solid #ddd 1px;
			color: rgba(0,0,0,0.3);
			font-size: 1.3em;
			font-family: Excalifont;
		}
		.value-na {
			font-weight: bold;
			font-style: italic;
			color: rgba(1,0,0,0.1);
			padding: 0.25em 1em;
			text-align: center;
			font-family: Excalifont;
		}
		.alarm-card {
			background: white;
			padding: 0.5em;
			margin: 1em 0.5em;
			border-radius: 5px;
			box-shadow: 3px 3px 5px #ddd;

			.head{
				display: flex;
				align-items: center;
				background: #f8f8f8;
				margin: -0.5em;
				margin-bottom: 0.5em;
				padding: 0.25em 0.5em;
				border-top-left-radius: 5px;
				border-top-right-radius: 5px;

				.id {
					font-family: monospace;
					background: #eee;
					padding: 0.25em 0.5em;
					margin: 0.25em;
					margin-right: 0.5em;
					border-radius: 5px;;
				}

				.description {
					font-weight: 500;;
					font-style: italic;
					color: #666;
				}
			}
			.body {
				display: flex;
				flex-wrap: wrap;
			}
			.keyval {

				display: inline-block;
				/* background: #f8f8f8; */
				border: solid #f0f0f0 1px;
				padding: 0.25em;
				margin: 0.25em;
				border-radius: 5px;;
				flex: 1 1 auto;

				label {
					display: block;
					font-size: 0.6em;
					font-weight: bold;
					color: rgba(0,0,0,0.5);
					/* text-decoration: underline; */
					/* margin-bottom: -0.5em; */

				}

				label + time {
					font-family: monospace;
					word-spacing: -0.3em;
				}

				.input-help {
					font-size: 0.6em;
					color: rgba(0,0,0,0.5);
					font-style: italic;
				}
			}
			.cancel-keyval-wrap {
				padding: 0.25em;
				margin: 0;
			}
			.keyval.cancel {
				margin:0;
				background-color:  rgba(255,0,0,0.05);
				border: solid rgba(255,0,0,0.2) 1px;
				font-family: Excalifont;
				vertical-align: center;
				width: 100%;
				height: 100%;
			}
			.keyval.cancel:hover {
				background-color:  rgba(255,0,0,0.1);
				border: solid rgba(255,0,0,0.3) 1px;
				cursor: pointer;
			}
			.keyval.quickadd {
				background-color:  rgba(0,255,0,0.05);
				border: solid rgba(0,255,0,0.2) 1px;
				font-family: Excalifont;
				vertical-align: center;
			}
			.keyval.quickadd:hover {
				background-color:  rgba(0,255,0,0.1);
				border: solid rgba(0,255,0,0.3) 1px;
				cursor: pointer;
			}
			.keyval.quicksubtract {
				background-color:  rgba(0,0,255,0.05);
				border: solid rgba(0,0,255,0.2) 1px;
				font-family: Excalifont;
				vertical-align: center;
			}
			.keyval.quicksubtract:hover {
				background-color:  rgba(0,0,255,0.1);
				border: solid rgba(0,0,255,0.3) 1px;
				cursor: pointer;
			}
		}

		.alarm-card.overdue {
			border: solid rgba(255,0,0,0.2) 1px;
				.head{
					background-color: rgba(255,0,0,0.1);
						.description {
							color: darkred;
						}
				}
		}

		.alarm-card.nearing-deadline {
			border: solid rgba(255,100,0,0.2) 1px;
				.head{
					background-color: rgba(255,100,0,0.1);
						.description {
							color: rgba(255,121,0,1);
						}
				}
		}

		.alarm-card.new-alarm {

			.body{
				gap: 1em;
			}

			.keyval {
				flex: 0 0 auto;
				align-content: center;
				border: none;
			}

			.keyval.description {
				flex: 1 0 auto;
			}

			input, select, button {
				width: 100%;
				border: 0;
				background-color: rgba(0,0,255,0.05);
				border-radius: 5px;
				padding: 0.5em;
				margin: 2px 0;
			}

			button {
				/* padding: 1em 0.5em; */
				background-color: rgba(0,255,0,0.05);
				border: solid rgba(0,255,0,0.2) 1px;
				font-family: Excalifont;
			}

			button:hover {
				background-color: rgba(0,255,0,0.1);
				border: solid rgba(0,255,0,0.3) 1px;
				cursor: pointer;
			}
		}

		svg {
			display: inline-block;
			height: 1em;
			vertical-align: center;
		}
		@media screen and (max-width: 576px) {
			/*
			body {
				background-color: pink;
			}
			*/
			.alarm-card .body .keyval {
				flex: 1 1 calc(45%);
			}
			.sm-dp-none {
				display: none;
				visibility: hidden;
				width: 0px;
				height: 0px;
			}
		}
		/*
		@media screen and (min-width: 576px) and (max-width: 768px) {
			body {
				background-color: lightgreen;
			}
		}
		*/
		</style>
	</head>
	<body>
		<header>
			{{block "page.header" . }}{{end}}
		</header>
		<main>
			{{block "page.main" . }}{{end}}
		</main>
		<footer>
			{{block "page.footer" . }}{{end}}
		</footer>
	</body>
</html>
